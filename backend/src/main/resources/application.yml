spring:
  application:
    name: testryn-backend
  datasource:
    url: ${TESTRYN_DB_URL:jdbc:postgresql://localhost:5432/testryn}
    username: ${TESTRYN_DB_USERNAME:testryn}
    password: ${TESTRYN_DB_PASSWORD:testryn}
  jpa:
    # Response DTOs are mapped in the web layer from entities returned by
    # @Transactional service methods, so lazy associations (e.g. TestPlan.entries,
    # TestCase.currentVersion) must still be loadable during that mapping.
    # Disabling open-in-view without eager-fetch queries for every response
    # produced LazyInitializationException on any endpoint returning a
    # previously-persisted entity graph (e.g. GET/POST .../test-plans/{id}).
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${TESTRYN_SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

testryn:
  storage:
    base-path: ${TESTRYN_STORAGE_BASE_PATH:./data/reports}
    max-upload-size-bytes: 52428800
  jira:
    base-url: ${TESTRYN_JIRA_BASE_URL:}
    email: ${TESTRYN_JIRA_EMAIL:}
    api-token: ${TESTRYN_JIRA_API_TOKEN:}

logging:
  level:
    com.testryn: INFO
