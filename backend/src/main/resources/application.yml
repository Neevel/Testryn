spring:
  application:
    name: testryn-backend
  datasource:
    url: ${TESTRYN_DB_URL:jdbc:postgresql://localhost:5432/testryn}
    username: ${TESTRYN_DB_USERNAME:testryn}
    password: ${TESTRYN_DB_PASSWORD:testryn}
  jpa:
    # Kept disabled deliberately (Spring Boot's OSIV default is true). Response DTOs
    # are mapped in the web layer from entities returned by @Transactional service
    # methods, so every read path that needs to be traversed by a response mapper
    # (project/entries/currentVersion/steps/testCases/result, ...) is loaded via
    # @EntityGraph on the relevant repository method, or explicitly initialized
    # inside the transactional service method -- never relying on an open session
    # reaching into the controller. See ExecutionService for the one case
    # (Execution.testCases + testCases.testCaseVersion.steps are both Hibernate
    # "bag" collections and cannot be fetch-joined together without
    # MultipleBagFetchException) that needs an explicit Hibernate.initialize() call
    # instead of a single @EntityGraph.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${TESTRYN_SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

testryn:
  storage:
    base-path: ${TESTRYN_STORAGE_BASE_PATH:./data/reports}
    max-upload-size-bytes: 52428800
  jira:
    base-url: ${TESTRYN_JIRA_BASE_URL:}
    email: ${TESTRYN_JIRA_EMAIL:}
    api-token: ${TESTRYN_JIRA_API_TOKEN:}

logging:
  level:
    com.testryn: INFO
