# Testryn Jira Forge Issue Panel -- see docs/jira-forge-integration.md and
# ADR 0014 for the full architecture and setup rationale.
#
# `app.id` below is a placeholder. Run `forge register` (or `forge create` for a
# brand-new app registration) once, authenticated as the Atlassian account that will
# own this app, and it will rewrite this value to a real
# `ari:cloud:ecosystem::app/<uuid>` -- never hand-edit it otherwise.
app:
  id: ari:cloud:ecosystem::app/7ad8348d-f2b4-43b9-82be-2ed6a3c10498
  runtime:
    name: nodejs22.x

modules:
  jira:issuePanel:
    - key: testryn-coverage-panel
      resource: main
      render: native
      resolver:
        function: resolver
      title: Testryn
      # Reuses frontend/public/favicon.svg's exact signet (Abschnitt 26 -- small,
      # not a marketing surface) via the "icon" resource declared below.
      icon: resource:icon;icon.svg

  function:
    - key: resolver
      handler: resolvers/index.handler

resources:
  - key: main
    path: src/frontend/index.jsx
  - key: icon
    path: static

# No Jira scopes requested: the panel only ever needs the current issue's own key,
# which useProductContext() already provides for free (Abschnitt 29) -- it never
# calls the Jira REST API itself. Definition edits are sent from the Forge resolver
# to Testryn with its server-side write-scoped service token (ADR 0016); Jira itself
# is never written and the token never reaches the browser.
permissions:
  scopes: []
  external:
    fetch:
      backend:
        # Egress allow-list: Forge rejects any resolver fetch to a host not listed
        # here, and (unlike the environment variables below) it accepts no variable
        # interpolation -- the value is always literal in this file.
        #
        # The committed value is a deliberate placeholder (like `app.id` above): it
        # is not a reachable host. Before `forge deploy` you must replace it LOCALLY
        # with the host the resolver will actually call -- a cloudflared/ngrok
        # tunnel to your local stack for verification, or a hosted Testryn instance
        # -- and set the matching `TESTRYN_API_BASE_URL` variable. Do NOT commit
        # that edit: an ephemeral *.trycloudflare.com address is machine-/session-
        # bound dev state, never repository state (AGENTS.md -> Sicherheit).
        # See docs/jira-forge-integration.md -> "Testryn Base URL".
        - address: https://testryn.example.com
# TESTRYN_API_BASE_URL / TESTRYN_APP_BASE_URL are plain (non-secret) config -- just
# URLs, safe to default and to see in `forge variables list`. TESTRYN_API_TOKEN is
# NOT declared here: encrypted variables are set directly via
# `forge variables set --encrypt`, never given a default or written to this file
# (Abschnitt 8/36 -- a token must never appear in source control).
environment:
  variables:
    - key: TESTRYN_API_BASE_URL
      default: 'http://localhost:8080'
    - key: TESTRYN_APP_BASE_URL
      default: 'http://localhost:3000'
    - key: JIRA_BASE_URL
      default: 'https://ki-meets-testautomation.atlassian.net'
